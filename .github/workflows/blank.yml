name: Build Workflow

on:
  workflow_dispatch:
    inputs:
      init_mode:
        description: "OpenClaw init mode: manual or auto"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - auto
      manual_wait_minutes:
        description: "Manual init max wait minutes (30-360)"
        required: false
        default: "60"
      max_runtime_minutes:
        description: "Monitor loop runtime minutes (60-345)"
        required: false
        default: "345"
      ssh_user:
        description: "SSH username (must match your Cloudflare email prefix)"
        required: false
        default: "140abc14"

jobs:
  build:
    name: Build Stage
    runs-on: macos-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 3

      - name: Resolve Workflow Inputs
        env:
          INPUT_INIT_MODE: ${{ github.event.inputs.init_mode }}
          INPUT_MANUAL_WAIT_MINUTES: ${{ github.event.inputs.manual_wait_minutes }}
          INPUT_MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes }}
          INPUT_SSH_USER: ${{ github.event.inputs.ssh_user }}
        run: |
          set -euo pipefail

          init_mode="${INPUT_INIT_MODE:-manual}"
          if [[ "${init_mode}" != "manual" && "${init_mode}" != "auto" ]]; then
            init_mode="manual"
          fi

          manual_wait_minutes="${INPUT_MANUAL_WAIT_MINUTES:-360}"
          if ! [[ "${manual_wait_minutes}" =~ ^[0-9]+$ ]]; then
            manual_wait_minutes=360
          fi
          if (( manual_wait_minutes < 30 )); then
            manual_wait_minutes=30
          fi
          if (( manual_wait_minutes > 360 )); then
            manual_wait_minutes=360
          fi

          max_runtime_minutes="${INPUT_MAX_RUNTIME_MINUTES:-345}"
          if ! [[ "${max_runtime_minutes}" =~ ^[0-9]+$ ]]; then
            max_runtime_minutes=345
          fi
          if (( max_runtime_minutes < 60 )); then
            max_runtime_minutes=60
          fi
          if (( max_runtime_minutes > 345 )); then
            max_runtime_minutes=345
          fi

          ssh_user="${INPUT_SSH_USER:-}"

          echo "INIT_MODE=${init_mode}" >> "${GITHUB_ENV}"
          echo "MANUAL_WAIT_MINUTES=${manual_wait_minutes}" >> "${GITHUB_ENV}"
          echo "MAX_RUNTIME_SECONDS=$((max_runtime_minutes * 60))" >> "${GITHUB_ENV}"
          echo "OPENCLAW_STATE_DIR=${HOME}/.openclaw" >> "${GITHUB_ENV}"
          echo "CF_SSH_USER=${ssh_user}" >> "${GITHUB_ENV}"

          echo "Init mode: ${init_mode}"
          echo "Manual wait minutes: ${manual_wait_minutes}"
          echo "Monitor runtime minutes: ${max_runtime_minutes}"
          if [[ -n "${ssh_user}" ]]; then
            echo "SSH user (Cloudflare): ${ssh_user}"
          fi

      - name: Setup Utilities
        run: |
          set -euo pipefail
          brew install cloudflared p7zip
          npm install -g openclaw@latest
          cloudflared --version
          openclaw --version

          npm i -g opencode-ai
          opencode version || opencode --version || echo "opencode version check skipped (non-critical)."

      - name: Validate Secrets
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          VNC_USER_PASSWORD: ${{ secrets.VNC_USER_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${TUNNEL_TOKEN:-}" ]]; then
            echo "Missing required secret: TUNNEL_TOKEN"
            exit 1
          fi
          if [[ "${TUNNEL_TOKEN}" != eyJ* ]]; then
            echo "TUNNEL_TOKEN format looks unexpected (it usually starts with eyJ)."
            exit 1
          fi

          effective_user_password="${VNC_USER_PASSWORD:-${RDP_PASSWORD:-}}"
          effective_vnc_password="${VNC_PASSWORD:-${RDP_PASSWORD:-}}"

          if [[ -z "${effective_user_password}" || -z "${effective_vnc_password}" ]]; then
            echo "Missing VNC credentials. Provide VNC_USER_PASSWORD and VNC_PASSWORD (or fallback RDP_PASSWORD)."
            exit 1
          fi

          echo "::add-mask::${effective_user_password}"
          echo "::add-mask::${effective_vnc_password}"

          {
            echo "EFFECTIVE_VNC_USER_PASSWORD<<EOF"
            echo "${effective_user_password}"
            echo "EOF"
            echo "EFFECTIVE_VNC_PASSWORD<<EOF"
            echo "${effective_vnc_password}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

          if [[ -n "${WEBDAV_URL:-}" && -n "${WEBDAV_USER:-}" && -n "${WEBDAV_PASSWORD:-}" ]]; then
            echo "::add-mask::${WEBDAV_PASSWORD}"
            echo "WebDAV backup configured."
          else
            echo "WARNING: WebDAV secrets incomplete (WEBDAV_URL, WEBDAV_USER, WEBDAV_PASSWORD). Backup/restore disabled."
          fi

          echo "Secret checks passed."

      - name: Enable Remote Access
        run: |
          set -euo pipefail

          sudo mdutil -i off -a || true

          # ── Shorten hostname (mDNS labels must be <=63 bytes) ──
          current_hostname="$(hostname)"
          if (( ${#current_hostname} > 50 )); then
            short_name="mac-oc-${RANDOM}"
            sudo scutil --set ComputerName "${short_name}"
            sudo scutil --set LocalHostName "${short_name}"
            echo "Hostname shortened: ${current_hostname} -> ${short_name}"
          fi

          pw="${EFFECTIVE_VNC_USER_PASSWORD}"
          cf_user="${CF_SSH_USER:-}"

          # ── Set password for existing runner users ──
          current_user="$(whoami)"
          echo "Current runner user: ${current_user}"
          sudo dscl . -passwd "/Users/${current_user}" "${pw}" 2>/dev/null || true

          console_user="$(stat -f%Su /dev/console 2>/dev/null || echo '')"
          if [[ -n "${console_user}" && "${console_user}" != "${current_user}" && "${console_user}" != "root" ]]; then
            echo "Console user: ${console_user}"
            sudo dscl . -passwd "/Users/${console_user}" "${pw}" 2>/dev/null || true
          fi

          for candidate in anka admin runner; do
            if [[ "${candidate}" != "${current_user}" && "${candidate}" != "${console_user:-}" ]] && dscl . -read "/Users/${candidate}" >/dev/null 2>&1; then
              sudo dscl . -passwd "/Users/${candidate}" "${pw}" 2>/dev/null || true
            fi
          done

          # ── Create Cloudflare SSH user (matches your CF email prefix) ──
          if [[ -n "${cf_user}" ]]; then
            echo "Creating Cloudflare SSH user: ${cf_user}"
            if ! dscl . -read "/Users/${cf_user}" >/dev/null 2>&1; then
              last_uid="$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1)"
              next_uid=$(( ${last_uid:-1000} + 1 ))
              sudo dscl . -create "/Users/${cf_user}"
              sudo dscl . -create "/Users/${cf_user}" UserShell /bin/bash
              sudo dscl . -create "/Users/${cf_user}" RealName "${cf_user}"
              sudo dscl . -create "/Users/${cf_user}" UniqueID "${next_uid}"
              sudo dscl . -create "/Users/${cf_user}" PrimaryGroupID 80
              sudo dscl . -create "/Users/${cf_user}" NFSHomeDirectory "/Users/${cf_user}"
              sudo createhomedir -c -u "${cf_user}" >/dev/null 2>&1 || true
            fi
            sudo dscl . -passwd "/Users/${cf_user}" "${pw}"
            echo "User ${cf_user} ready (password = your RDP_PASSWORD)."
          else
            echo "NOTE: ssh_user input is empty. If browser SSH fails, re-run workflow with ssh_user set to your Cloudflare email prefix."
          fi

          echo "Available accounts (uid>=500):"
          dscl . -list /Users UniqueID | awk '$2 >= 500 {print "  - " $1 " (uid " $2 ")"}'

          # ── Enable SSH (primary access) ──
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true

          sshd_config="/etc/ssh/sshd_config"
          if [[ -f "${sshd_config}" ]]; then
            sudo cp "${sshd_config}" "${sshd_config}.bak"
            sudo sed -i '' 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' "${sshd_config}"
            sudo sed -i '' 's/^#*ChallengeResponseAuthentication.*/ChallengeResponseAuthentication yes/' "${sshd_config}"
            sudo sed -i '' 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/' "${sshd_config}"
            sudo sed -i '' 's/^#*UsePAM.*/UsePAM yes/' "${sshd_config}"
          fi

          if launchctl list | grep -q com.openssh.sshd; then
            sudo launchctl kickstart -k system/com.openssh.sshd 2>/dev/null || true
          fi

          for i in {1..10}; do
            if lsof -nP -iTCP:22 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "SSH is listening on :22"
              break
            fi
            sleep 2
          done

          echo "=== SSH status ==="
          lsof -nP -iTCP:22 -sTCP:LISTEN 2>/dev/null || echo "WARNING: SSH not detected on :22"

          # ── Enable VNC as fallback (optional) ──
          kickstart="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          sudo "${kickstart}" -configure -allowAccessFor -allUsers -privs -all 2>/dev/null || true
          sudo "${kickstart}" -configure -clientopts -setvnclegacy -vnclegacy yes 2>/dev/null || true
          printf '%s\n' "${EFFECTIVE_VNC_PASSWORD}" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null
          sudo "${kickstart}" -restart -agent -console 2>/dev/null || true
          sudo "${kickstart}" -activate 2>/dev/null || true

          echo "=== VNC status (fallback) ==="
          lsof -nP -iTCP:5900 -sTCP:LISTEN 2>/dev/null || echo "(VNC not detected, SSH is primary)"

      - name: Start Cloudflared
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
        run: |
          set -euo pipefail

          cf_log="${RUNNER_TEMP}/cloudflared.log"
          cf_pid_file="${RUNNER_TEMP}/cloudflared.pid"

          echo "CF_LOG_FILE=${cf_log}" >> "${GITHUB_ENV}"
          echo "CF_PID_FILE=${cf_pid_file}" >> "${GITHUB_ENV}"

          nohup cloudflared tunnel --no-autoupdate run --token "${TUNNEL_TOKEN}" > "${cf_log}" 2>&1 &
          cf_pid="$!"
          echo "${cf_pid}" > "${cf_pid_file}"
          sleep 8

          if ps -p "${cf_pid}" >/dev/null 2>&1; then
            echo "cloudflared started (pid ${cf_pid})"
          else
            echo "cloudflared failed to start, check ${cf_log}"
            tail -n 80 "${cf_log}" || true
            exit 1
          fi

      - name: Create Backup Script
        run: |
          set -euo pipefail

          script_path="${GITHUB_WORKSPACE}/backup-openclaw-state.sh"
          cat > "${script_path}" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          webdav_url="${1:-}"
          webdav_user="${2:-}"
          webdav_pass="${3:-}"

          state_dir="${HOME}/.openclaw"
          root_state_dir="/var/root/.openclaw"
          if [[ -d "${root_state_dir}" && -f "${root_state_dir}/openclaw.json" ]]; then
            state_dir="${root_state_dir}"
            echo "Using root state dir: ${state_dir}"
          elif [[ -d "${HOME}/.openclaw" && -f "${HOME}/.openclaw/openclaw.json" ]]; then
            state_dir="${HOME}/.openclaw"
            echo "Using home state dir: ${state_dir}"
          fi

          tmp_root="${RUNNER_TEMP:-/tmp}"
          temp_copy="${tmp_root}/openclaw-copy-${RANDOM}"
          archive_file="${tmp_root}/openclaw-state.tar.gz"

          cleanup() { rm -rf "${temp_copy}"; rm -f "${archive_file}"; }
          trap cleanup EXIT

          if [[ -z "${webdav_url}" || -z "${webdav_user}" || -z "${webdav_pass}" ]]; then
            echo "WebDAV secrets missing, skipping backup."
            exit 0
          fi

          if [[ ! -d "${state_dir}" ]]; then
            echo "OpenClaw state directory not found, skipping backup."
            exit 0
          fi

          mkdir -p "${temp_copy}"
          sudo rsync -a --delete --exclude "*.lock" --exclude "*.tmp" "${state_dir}/" "${temp_copy}/"

          if [[ -z "$(find "${temp_copy}" -mindepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "State directory is empty after filtering, skipping backup."
            exit 0
          fi

          tar -C "${temp_copy}" -czf "${archive_file}" .
          file_size="$(stat -f%z "${archive_file}" 2>/dev/null || stat -c%s "${archive_file}" 2>/dev/null || echo 0)"
          size_mb="$(awk -v b="${file_size}" 'BEGIN { printf "%.2f", b/1024/1024 }')"
          echo "Archive size: ${size_mb} MB"

          base_url="${webdav_url%/}"
          curl -sf -X MKCOL -u "${webdav_user}:${webdav_pass}" "${base_url}/openclaw-backup/" 2>/dev/null || true

          remote_path="${base_url}/openclaw-backup/openclaw-state.tar.gz"
          http_code="$(curl -w '%{http_code}' -o /dev/null -s \
            -T "${archive_file}" \
            -u "${webdav_user}:${webdav_pass}" \
            "${remote_path}")"

          if [[ "${http_code}" =~ ^2 ]]; then
            echo "Backup uploaded OK (HTTP ${http_code}): ${remote_path}"
          else
            echo "Backup upload FAILED (HTTP ${http_code})."
            exit 1
          fi

          verify_size="$(curl -sI -u "${webdav_user}:${webdav_pass}" "${remote_path}" | grep -i content-length | awk '{print $2}' | tr -d '\r')"
          if [[ -n "${verify_size}" && "${verify_size}" == "${file_size}" ]]; then
            echo "VERIFIED OK: remote size matches (${verify_size} bytes)."
          else
            echo "VERIFY NOTE: remote size=${verify_size:-unknown}, local size=${file_size}."
          fi
          SCRIPT

          chmod +x "${script_path}"
          echo "Backup script created at ${script_path}"

      - name: Restore OpenClaw State
        id: restore
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail

          state_dir="${HOME}/.openclaw"
          root_state_dir="/var/root/.openclaw"
          archive="${RUNNER_TEMP}/openclaw-restore.tar.gz"
          restored="false"

          mkdir -p "${state_dir}"
          sudo mkdir -p "${root_state_dir}"

          if [[ -z "${WEBDAV_URL:-}" || -z "${WEBDAV_USER:-}" || -z "${WEBDAV_PASSWORD:-}" ]]; then
            echo "WebDAV secrets missing, skip restore."
          else
            base_url="${WEBDAV_URL%/}"
            remote_path="${base_url}/openclaw-backup/openclaw-state.tar.gz"

            http_code="$(curl -w '%{http_code}' -o "${archive}" -s \
              -u "${WEBDAV_USER}:${WEBDAV_PASSWORD}" \
              "${remote_path}")"

            if [[ "${http_code}" =~ ^2 && -f "${archive}" && -s "${archive}" ]]; then
              tar -xzf "${archive}" -C "${state_dir}" && restored="true"
              sudo tar -xzf "${archive}" -C "${root_state_dir}" || true
              size="$(stat -f%z "${archive}" 2>/dev/null || stat -c%s "${archive}" 2>/dev/null || echo '?')"
              echo "Restored to ${state_dir} and ${root_state_dir} (${size} bytes)."
            elif [[ "${http_code}" == "404" ]]; then
              echo "No previous backup found on WebDAV. This is a fresh state."
            else
              echo "WebDAV download failed (HTTP ${http_code}), skip restore."
            fi
          fi

          has_config="false"
          if [[ -f "${state_dir}/openclaw.json" || -f "${root_state_dir}/openclaw.json" ]]; then
            has_config="true"
          fi

          echo "restored=${restored}" >> "${GITHUB_OUTPUT}"
          echo "has_config=${has_config}" >> "${GITHUB_OUTPUT}"

          rm -f "${archive}"

      - name: Initialize OpenClaw
        id: initialize
        env:
          HAS_CONFIG: ${{ steps.restore.outputs.has_config }}
          INIT_MODE: ${{ env.INIT_MODE }}
          MANUAL_WAIT_MINUTES: ${{ env.MANUAL_WAIT_MINUTES }}
          OPENCLAW_AUTH_CHOICE: ${{ secrets.OPENCLAW_AUTH_CHOICE }}
          OPENCLAW_ANTHROPIC_API_KEY: ${{ secrets.OPENCLAW_ANTHROPIC_API_KEY }}
          OPENCLAW_ZAI_API_KEY: ${{ secrets.OPENCLAW_ZAI_API_KEY }}
          OPENCLAW_OPENCODE_API_KEY: ${{ secrets.OPENCLAW_OPENCODE_API_KEY }}
          OPENCLAW_CF_ACCOUNT_ID: ${{ secrets.OPENCLAW_CF_ACCOUNT_ID }}
          OPENCLAW_CF_GATEWAY_ID: ${{ secrets.OPENCLAW_CF_GATEWAY_ID }}
          OPENCLAW_CF_API_KEY: ${{ secrets.OPENCLAW_CF_API_KEY }}
          OPENCLAW_CUSTOM_BASE_URL: ${{ secrets.OPENCLAW_CUSTOM_BASE_URL }}
          OPENCLAW_CUSTOM_MODEL_ID: ${{ secrets.OPENCLAW_CUSTOM_MODEL_ID }}
          OPENCLAW_CUSTOM_API_KEY: ${{ secrets.OPENCLAW_CUSTOM_API_KEY }}
        run: |
          set -euo pipefail

          find_config() {
            for p in "${HOME}/.openclaw/openclaw.json" "/var/root/.openclaw/openclaw.json" "/Users/runner/.openclaw/openclaw.json"; do
              if [[ -f "${p}" ]]; then
                echo "${p}"
                return 0
              fi
            done
            return 1
          }

          config_path="${HOME}/.openclaw/openclaw.json"
          if found="$(find_config)"; then
            config_path="${found}"
          fi

          initialized_now="false"
          actual_mode="${INIT_MODE:-manual}"

          run_auto_onboard() {
            local common=(
              openclaw onboard
              --non-interactive
              --mode local
              --gateway-port 18789
              --gateway-bind loopback
              --install-daemon
              --daemon-runtime node
              --skip-skills
            )

            case "${OPENCLAW_AUTH_CHOICE:-}" in
              apiKey|anthropic-api-key)
                if [[ -z "${OPENCLAW_ANTHROPIC_API_KEY:-}" ]]; then
                  echo "Missing OPENCLAW_ANTHROPIC_API_KEY for auto mode."
                  return 1
                fi
                "${common[@]}" --auth-choice apiKey --anthropic-api-key "${OPENCLAW_ANTHROPIC_API_KEY}"
                ;;
              zai-api-key)
                if [[ -z "${OPENCLAW_ZAI_API_KEY:-}" ]]; then
                  echo "Missing OPENCLAW_ZAI_API_KEY for auto mode."
                  return 1
                fi
                "${common[@]}" --auth-choice zai-api-key --zai-api-key "${OPENCLAW_ZAI_API_KEY}"
                ;;
              opencode-zen)
                if [[ -z "${OPENCLAW_OPENCODE_API_KEY:-}" ]]; then
                  echo "Missing OPENCLAW_OPENCODE_API_KEY for auto mode."
                  return 1
                fi
                "${common[@]}" --auth-choice opencode-zen --opencode-zen-api-key "${OPENCLAW_OPENCODE_API_KEY}"
                ;;
              cloudflare-ai-gateway-api-key)
                if [[ -z "${OPENCLAW_CF_ACCOUNT_ID:-}" || -z "${OPENCLAW_CF_GATEWAY_ID:-}" || -z "${OPENCLAW_CF_API_KEY:-}" ]]; then
                  echo "Missing Cloudflare AI Gateway secrets for auto mode."
                  return 1
                fi
                "${common[@]}" \
                  --auth-choice cloudflare-ai-gateway-api-key \
                  --cloudflare-ai-gateway-account-id "${OPENCLAW_CF_ACCOUNT_ID}" \
                  --cloudflare-ai-gateway-gateway-id "${OPENCLAW_CF_GATEWAY_ID}" \
                  --cloudflare-ai-gateway-api-key "${OPENCLAW_CF_API_KEY}"
                ;;
              custom-api-key)
                if [[ -z "${OPENCLAW_CUSTOM_BASE_URL:-}" || -z "${OPENCLAW_CUSTOM_MODEL_ID:-}" ]]; then
                  echo "Missing OPENCLAW_CUSTOM_BASE_URL or OPENCLAW_CUSTOM_MODEL_ID for auto mode."
                  return 1
                fi
                "${common[@]}" \
                  --auth-choice custom-api-key \
                  --custom-base-url "${OPENCLAW_CUSTOM_BASE_URL}" \
                  --custom-model-id "${OPENCLAW_CUSTOM_MODEL_ID}" \
                  --custom-api-key "${OPENCLAW_CUSTOM_API_KEY:-}" \
                  --custom-compatibility openai
                ;;
              *)
                echo "Auto mode is enabled but OPENCLAW_AUTH_CHOICE is missing/unsupported."
                return 1
                ;;
            esac
          }

          if found="$(find_config)"; then
            config_path="${found}"
          fi

          if [[ "${HAS_CONFIG:-false}" == "true" ]] && found="$(find_config)"; then
            config_path="${found}"
            echo "Existing OpenClaw state found at ${config_path}, skip first-run initialization."
            echo "initialized_now=false" >> "${GITHUB_OUTPUT}"
            echo "init_mode_used=history" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${actual_mode}" == "auto" ]]; then
            echo "Trying auto onboarding..."
            if run_auto_onboard && find_config >/dev/null 2>&1; then
              config_path="$(find_config)"
              initialized_now="true"
              echo "Auto onboarding completed."
            else
              echo "Auto onboarding unavailable/failed, fallback to manual onboarding."
              actual_mode="manual"
            fi
          fi

          if ! find_config >/dev/null 2>&1; then
            wait_minutes="${MANUAL_WAIT_MINUTES:-360}"
            wait_seconds=$((wait_minutes * 60))
            elapsed=0
            interval=30

            echo "======================================================"
            echo "No historical OpenClaw state detected."
            echo "Connect via browser SSH (your Cloudflare domain) and run:"
            echo ""
            echo "  openclaw onboard"
            echo ""
            echo "Then run (recommended):"
            echo "  openclaw doctor --repair"
            echo ""
            echo "Login user: $(whoami)  password: your RDP_PASSWORD secret"
            echo "======================================================"
            echo "Waiting up to ${wait_minutes} minute(s) for manual onboarding..."

            while (( elapsed < wait_seconds )); do
              if found="$(find_config)"; then
                config_path="${found}"
                initialized_now="true"
                echo "Detected ${config_path}. Manual onboarding finished."
                break
              fi
              sleep "${interval}"
              elapsed=$((elapsed + interval))
              if (( elapsed % 300 == 0 )); then
                remain=$(((wait_seconds - elapsed) / 60))
                echo "Still waiting for manual onboarding... remaining ${remain} minute(s)."
              fi
            done

            if ! find_config >/dev/null 2>&1; then
              echo "Manual onboarding wait window ended after ${wait_minutes} minute(s). Continuing to monitor loop."
            fi
          fi

          echo "initialized_now=${initialized_now}" >> "${GITHUB_OUTPUT}"
          echo "init_mode_used=${actual_mode}" >> "${GITHUB_OUTPUT}"

      - name: Run Doctor Repair
        run: |
          set -euo pipefail

          if openclaw doctor --repair; then
            echo "openclaw doctor --repair completed."
          else
            echo "doctor --repair failed, trying non-interactive safe pass."
            openclaw doctor --non-interactive || true
          fi

      - name: First Initialization Snapshot Backup
        if: steps.initialize.outputs.initialized_now == 'true'
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail

          script_path="${GITHUB_WORKSPACE}/backup-openclaw-state.sh"
          if [[ -x "${script_path}" ]]; then
            echo "Running first initialization snapshot backup..."
            "${script_path}" "${WEBDAV_URL:-}" "${WEBDAV_USER:-}" "${WEBDAV_PASSWORD:-}"
          else
            echo "Backup script missing, skip first snapshot backup."
          fi

      - name: Monitor, Auto-Restart, and Periodic Backup
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          MAX_RUNTIME_SECONDS: ${{ env.MAX_RUNTIME_SECONDS }}
          CF_PID_FILE: ${{ env.CF_PID_FILE }}
          CF_LOG_FILE: ${{ env.CF_LOG_FILE }}
        run: |
          set -euo pipefail

          backup_interval=1800
          max_runtime="${MAX_RUNTIME_SECONDS:-20700}"
          elapsed=0
          last_backup=0

          gw_log="${RUNNER_TEMP}/openclaw-gateway.log"
          gw_pid_file="${RUNNER_TEMP}/openclaw-gateway.pid"
          cf_pid_file="${CF_PID_FILE:-${RUNNER_TEMP}/cloudflared.pid}"
          cf_log_file="${CF_LOG_FILE:-${RUNNER_TEMP}/cloudflared.log}"
          backup_script="${GITHUB_WORKSPACE}/backup-openclaw-state.sh"

          gw_fail_count=0
          gw_max_fails=5
          cf_fail_count=0
          cf_max_fails=5

          is_gateway_listening() {
            lsof -nP -iTCP:18789 -sTCP:LISTEN >/dev/null 2>&1
          }

          stop_gateway_listener() {
            local pids
            pids="$(lsof -tiTCP:18789 -sTCP:LISTEN || true)"
            if [[ -n "${pids}" ]]; then
              # shellcheck disable=SC2086
              kill -9 ${pids} || true
            fi
          }

          find_oc_home() {
            for p in "${HOME}/.openclaw" "/var/root/.openclaw"; do
              if [[ -f "${p}/openclaw.json" ]]; then
                echo "${p}"
                return 0
              fi
            done
            return 1
          }

          oc_home=""
          if found_home="$(find_oc_home)"; then
            oc_home="${found_home}"
          fi

          if [[ -n "${oc_home}" ]]; then
            export OPENCLAW_HOME="${oc_home}"
            echo "OPENCLAW_HOME=${oc_home}"
          else
            echo "No openclaw.json found in any known path. Gateway will not auto-start."
            echo "Connect via SSH and run 'openclaw onboard' first."
          fi

          start_gateway() {
            if [[ -z "${oc_home}" ]]; then
              if found_home="$(find_oc_home)"; then
                oc_home="${found_home}"
                export OPENCLAW_HOME="${oc_home}"
                echo "Found config at ${oc_home}, will start gateway."
              else
                echo "No openclaw.json config found, skip gateway start."
                return 1
              fi
            fi

            stop_gateway_listener
            rm -f "${gw_log}"
            OPENCLAW_HOME="${oc_home}" nohup openclaw gateway --port 18789 --allow-unconfigured > "${gw_log}" 2>&1 &
            echo "$!" > "${gw_pid_file}"

            for i in {1..10}; do
              sleep 3
              if is_gateway_listening; then
                echo "Gateway listening on port 18789."
                return 0
              fi
            done

            echo "Gateway failed to listen within 30 seconds."
            if [[ -f "${gw_log}" ]]; then
              echo "--- gateway log (last 40 lines) ---"
              tail -n 40 "${gw_log}" || true
              echo "--- end gateway log ---"
            fi
            return 1
          }

          is_cloudflared_running() {
            if [[ ! -f "${cf_pid_file}" ]]; then
              return 1
            fi
            local pid
            pid="$(cat "${cf_pid_file}" 2>/dev/null || true)"
            if [[ -z "${pid}" ]]; then
              return 1
            fi
            ps -p "${pid}" >/dev/null 2>&1
          }

          start_cloudflared() {
            if [[ -z "${TUNNEL_TOKEN:-}" ]]; then
              echo "TUNNEL_TOKEN missing, cannot restart cloudflared."
              return 1
            fi

            rm -f "${cf_log_file}"
            nohup cloudflared tunnel --no-autoupdate run --token "${TUNNEL_TOKEN}" > "${cf_log_file}" 2>&1 &
            echo "$!" > "${cf_pid_file}"
            sleep 8

            if is_cloudflared_running; then
              echo "cloudflared is running."
              return 0
            fi

            echo "cloudflared restart failed."
            if [[ -f "${cf_log_file}" ]]; then
              echo "--- cloudflared log (last 40 lines) ---"
              tail -n 40 "${cf_log_file}" || true
              echo "--- end cloudflared log ---"
            fi
            return 1
          }

          if [[ -n "${oc_home}" ]] && ! is_gateway_listening; then
            echo "Gateway is not running, starting now..."
            if ! start_gateway; then
              gw_fail_count=$((gw_fail_count + 1))
            fi
          elif [[ -z "${oc_home}" ]]; then
            echo "No config found, gateway auto-start skipped. Waiting for manual onboarding via SSH..."
          fi

          if ! is_cloudflared_running; then
            echo "cloudflared is not running, starting now..."
            if ! start_cloudflared; then
              cf_fail_count=$((cf_fail_count + 1))
            fi
          fi

          while (( elapsed < max_runtime )); do
            sleep 60
            elapsed=$((elapsed + 60))
            run_min=$((elapsed / 60))
            now="$(date '+%H:%M:%S')"

            if [[ -z "${oc_home}" ]]; then
              if found_home="$(find_oc_home)"; then
                oc_home="${found_home}"
                export OPENCLAW_HOME="${oc_home}"
                echo "[${now}] Config detected at ${oc_home}! Starting gateway..."
                gw_fail_count=0
              fi
            fi

            if [[ -n "${oc_home}" ]] && ! is_gateway_listening; then
              if (( gw_fail_count < gw_max_fails )); then
                echo "[${now}] Gateway down, restarting ($((gw_fail_count + 1))/${gw_max_fails})..."
                if start_gateway; then
                  gw_fail_count=0
                else
                  gw_fail_count=$((gw_fail_count + 1))
                fi
              fi
              if (( gw_fail_count >= gw_max_fails )); then
                echo "[${now}] Gateway restart limit reached. Please connect and fix manually."
              fi
            elif [[ -n "${oc_home}" ]] && (( gw_fail_count > 0 )); then
              echo "[${now}] Gateway recovered, reset fail counter."
              gw_fail_count=0
            fi

            if ! is_cloudflared_running; then
              if (( cf_fail_count < cf_max_fails )); then
                echo "[${now}] cloudflared down, restarting ($((cf_fail_count + 1))/${cf_max_fails})..."
                if start_cloudflared; then
                  cf_fail_count=0
                else
                  cf_fail_count=$((cf_fail_count + 1))
                fi
              fi
              if (( cf_fail_count >= cf_max_fails )); then
                echo "[${now}] cloudflared restart limit reached. Please check tunnel token/config."
              fi
            elif (( cf_fail_count > 0 )); then
              echo "[${now}] cloudflared recovered, reset fail counter."
              cf_fail_count=0
            fi

            if (( elapsed - last_backup >= backup_interval )); then
              echo "[${now}] Periodic backup at runtime ${run_min} minute(s)."
              if [[ -x "${backup_script}" ]]; then
                "${backup_script}" "${WEBDAV_URL:-}" "${WEBDAV_USER:-}" "${WEBDAV_PASSWORD:-}" || echo "Periodic backup failed."
              else
                echo "Backup script not found, skip periodic backup."
              fi
              last_backup="${elapsed}"
            fi
          done

          echo "Monitor window finished after $((max_runtime / 60)) minute(s)."

      - name: Final State Backup
        if: always()
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail

          script_path="${GITHUB_WORKSPACE}/backup-openclaw-state.sh"
          if [[ -x "${script_path}" ]]; then
            echo "Running final state backup..."
            "${script_path}" "${WEBDAV_URL:-}" "${WEBDAV_USER:-}" "${WEBDAV_PASSWORD:-}" || echo "Final backup failed."
          else
            echo "Backup script not found, skip final backup."
          fi

          echo "Final backup step completed."
